[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adverscan"
version = "0.1.0"
description = "Adversarial Hardening and Security Testing Platform Across Generalized Domains"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "joblib>=1.3.0",
    "openpyxl>=3.1.0",
    "mlflow>=2.0.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.7.0",
    "datasets>=2.0.0",
    "transformers>=4.30.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.16.0",
    "adversarial-robustness-toolbox>=1.14.0",
    "foolbox>=3.3.0",
    "shap>=0.42.0",
    "lime>=0.2.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.pyrefly]
project-includes = ["app/**", "scripts/**", "tests/**"]
project-excludes = ["**/*venv/**", "**/.*/**"]
search-path = ["."]
site-package-path = [".venv/lib/python3.14/site-packages", ".venv/lib/python3.12/site-packages"]
python-version = "3.12"
python-platform = "linux"
ignore-missing-imports = [
    "tensorflow",
    "tensorflow.*",
    "onnxruntime",
    "onnxruntime.*",
]
