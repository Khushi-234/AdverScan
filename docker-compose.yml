version: '3.8'

services:
  adverscan-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adverscan_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=development
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload

  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.8.0
    container_name: adverscan_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlruns --host 0.0.0.0 --port 5000
